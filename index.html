<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denisita's Medication Tracker</title>
  
    <!-- Absolute paths so NFC URLs don't break CSS/JS -->
    <link rel="stylesheet" href="/med-tracker/style.css">
    <link rel="manifest" href="/med-tracker/manifest.json">
    <link rel="icon" href="/med-tracker/icons/Pill_icon.jfif">
  </head>
<body>
  <div class="container">
    <h1>Denisita’s Medication Tracker</h1>

    <div class="toggle-row">
      <label class="toggle-label">
        <span>Breakfast</span>
        <input type="checkbox" id="breakfastToggle">
        <span class="slider"></span>
      </label>
      <div id="breakfastTime" class="time-label"></div>
    </div>

    <div class="toggle-row">
      <label class="toggle-label">
        <span>Lunch</span>
        <input type="checkbox" id="lunchToggle">
        <span class="slider"></span>
      </label>
      <div id="lunchTime" class="time-label"></div>
    </div>
  </div>

  <script src="/med-tracker/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
