<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denisita's Tracker</title>

    <link rel="stylesheet" href="/med-tracker/style.css">
    <link rel="manifest" href="/med-tracker/manifest.json">
    <link rel="icon" href="/med-tracker/icons/Denisita-Tracker-Logo.png">
  </head>

  <body>
    <div class="container">

      <!-- Pill Title -->
      <div id="pillTitle" class="pill-title">Meds Tracker</div>

      <!-- Carousel Wrapper -->
      <div class="carousel-wrapper">
        <div class="carousel" id="carousel">

          <!-- SCREEN 1: Meds Tracker -->
          <section class="screen">
            <div class="screen-inner">

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Breakfast</span>
                  <input type="checkbox" id="breakfastToggle">
                  <span class="slider"></span>
                </label>
                <div id="breakfastTime" class="time-label"></div>
              </div>

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Lunch</span>
                  <input type="checkbox" id="lunchToggle">
                  <span class="slider"></span>
                </label>
                <div id="lunchTime" class="time-label"></div>
              </div>

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Night</span>
                  <input type="checkbox" id="nightToggle">
                  <span class="slider"></span>
                </label>
                <div id="nightTime" class="time-label"></div>
              </div>

            </div>
          </section>

          <!-- SCREEN 2: Teeth Cleaning -->
          <section class="screen">
            <div class="screen-inner">

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Morning Brush</span>
                  <input type="checkbox" id="brushMorning">
                  <span class="slider"></span>
                </label>
                <div id="brushMorningTime" class="time-label"></div>
              </div>

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Night Brush</span>
                  <input type="checkbox" id="brushNight">
                  <span class="slider"></span>
                </label>
                <div id="brushNightTime" class="time-label"></div>
              </div>

            </div>
          </section>

          <!-- SCREEN 3: Milo’s Tracker -->
          <section class="screen">
            <div class="screen-inner">

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Breakfast</span>
                  <input type="checkbox" id="miloBreakfast">
                  <span class="slider"></span>
                </label>
                <div id="miloBreakfastTime" class="time-label"></div>
              </div>

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Lunch</span>
                  <input type="checkbox" id="miloLunch">
                  <span class="slider"></span>
                </label>
                <div id="miloLunchTime" class="time-label"></div>
              </div>

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Snackie</span>
                  <input type="checkbox" id="miloSnackie">
                  <span class="slider"></span>
                </label>
                <div id="miloSnackieTime" class="time-label"></div>
              </div>

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Dinner</span>
                  <input type="checkbox" id="miloDinner">
                  <span class="slider"></span>
                </label>
                <div id="miloDinnerTime" class="time-label"></div>
              </div>

              <div class="toggle-row">
                <label class="toggle-label">
                  <span>Brush Teeth</span>
                  <input type="checkbox" id="miloBrushTeeth">
                  <span class="slider"></span>
                </label>
                <div id="miloBrushTeethTime" class="time-label"></div>
              </div>

            </div>
          </section>

        </div>
      </div>

      <!-- Navigation Arrows -->
      <div class="nav-arrows">
        <button id="prevScreen" class="nav-btn">‹</button>
        <button id="nextScreen" class="nav-btn">›</button>
      </div>

    </div>

    <script src="/med-tracker/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/med-tracker/service-worker.js");
      }
    </script>
  </body>
</html>
